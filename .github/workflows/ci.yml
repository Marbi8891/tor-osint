name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest

  docker:
    name: Docker + Tor real
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    env:
      # La onion oficial de The Tor Project: objetivo legítimo para una prueba de extremo a extremo.
      TORPROJECT_ONION: http://2gzyxa5ihm7nsggfxnu52rck2vv4rvmdlkiu3zzui5du4xyclen53wid.onion/
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start Tor (waits for 100% bootstrap via healthcheck)
        run: |
          echo "TOR_OSINT_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "TOR_OSINT_GID=$(id -g)" >> "$GITHUB_ENV"
          TOR_OSINT_UID=$(id -u) TOR_OSINT_GID=$(id -g) docker compose up -d --wait --wait-timeout 600 tor
      - name: tor-check through the real Tor network
        run: docker compose run --rm cli tor-check
      - name: Crawl the Tor Project onion service
        run: |
          docker compose run --rm cli crawl --url "$TORPROJECT_ONION"
          docker compose run --rm cli iocs
      - name: Report, STIX export and evidence verification
        run: |
          docker compose run --rm cli report
          docker compose run --rm cli export --format stix
          docker compose run --rm cli verify
      - name: Web UI container answers on loopback only
        run: |
          docker compose up -d web
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8765/ && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:8765/)" = 421
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
