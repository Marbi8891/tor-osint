[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tor-osint"
version = "0.5.0"
description = "Plataforma local de investigación OSINT sobre fuentes .onion definidas explícitamente, vía Tor."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests[socks]>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# stix2 solo valida en los tests que la exportación STIX 2.1 es conforme.
dev = ["pytest>=8", "ruff>=0.5", "stix2>=3.0"]

[project.scripts]
tor-osint = "tor_osint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tor_osint = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos en español con tildes/comillas

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "S105", "S106", "S108"]
