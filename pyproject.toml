[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tor-osint"
version = "0.5.0"
description = "Plataforma local de investigación OSINT sobre fuentes .onion definidas explícitamente, vía Tor."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Mrabeh Fathi" }]
keywords = ["osint", "tor", "onion", "threat-intelligence", "ioc", "stix", "cybersecurity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "requests[socks]>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# stix2 solo valida en los tests que la exportación STIX 2.1 es conforme.
dev = ["pytest>=8", "ruff>=0.5", "stix2>=3.0"]

[project.urls]
Homepage = "https://github.com/Marbi8891/tor-osint"
Documentation = "https://github.com/Marbi8891/tor-osint/blob/main/docs/MANUAL.md"
Issues = "https://github.com/Marbi8891/tor-osint/issues"
Changelog = "https://github.com/Marbi8891/tor-osint/blob/main/CHANGELOG.md"

[project.scripts]
tor-osint = "tor_osint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tor_osint = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos en español con tildes/comillas

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "S105", "S106", "S108"]
